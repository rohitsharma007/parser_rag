name: ATR Automation CI

on:
  push:
    branches:
      - main
      - develop
      - 'feature/**'
  pull_request:
    branches:
      - main
      - develop

jobs:
  # ──────────────────────────────────────────────────────────────────────────
  # Smoke Tests — run on every push/PR
  # ──────────────────────────────────────────────────────────────────────────
  smoke-tests:
    name: Smoke Tests (Chrome Headless)
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Java 11
        uses: actions/setup-java@v4
        with:
          java-version: '11'
          distribution: 'temurin'
          cache: maven

      - name: Install Chrome
        uses: browser-actions/setup-chrome@v1

      - name: Run smoke tests
        working-directory: samples/java_automation_framework
        run: |
          mvn test \
            -Dbrowser=chrome \
            -Dheadless=true \
            -Denv=staging \
            -Dgroups=smoke \
            --no-transfer-progress

      - name: Upload test reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: smoke-test-reports
          path: samples/java_automation_framework/target/surefire-reports/

  # ──────────────────────────────────────────────────────────────────────────
  # Regression Tests — run on pushes to main/develop only
  # ──────────────────────────────────────────────────────────────────────────
  regression-tests:
    name: Regression Tests
    runs-on: ubuntu-latest
    needs: smoke-tests
    if: github.ref == 'refs/heads/main' || github.ref == 'refs/heads/develop'

    strategy:
      matrix:
        browser: [chrome, firefox]

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Java 11
        uses: actions/setup-java@v4
        with:
          java-version: '11'
          distribution: 'temurin'
          cache: maven

      - name: Install ${{ matrix.browser }}
        uses: browser-actions/setup-chrome@v1
        if: matrix.browser == 'chrome'

      - name: Install Firefox
        uses: browser-actions/setup-firefox@v1
        if: matrix.browser == 'firefox'

      - name: Run regression tests (${{ matrix.browser }})
        working-directory: samples/java_automation_framework
        run: |
          mvn test \
            -Dbrowser=${{ matrix.browser }} \
            -Dheadless=true \
            -Denv=staging \
            -P regression \
            --no-transfer-progress

      - name: Upload test reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: regression-reports-${{ matrix.browser }}
          path: samples/java_automation_framework/target/surefire-reports/
