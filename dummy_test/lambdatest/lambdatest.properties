# LambdaTest Configuration
# ─────────────────────────────────────────────────────────────────────────────
# Credentials — override at runtime via environment variables:
#   LT_USERNAME and LT_ACCESS_KEY
# ─────────────────────────────────────────────────────────────────────────────

lt.username=${LT_USERNAME}
lt.access.key=${LT_ACCESS_KEY}

# LambdaTest Hub URL
lt.hub.url=https://hub.lambdatest.com/wd/hub

# Build name shown in LambdaTest dashboard
lt.build.name=ATR Automation Framework - Regression

# Capabilities
lt.browser=chrome
lt.browser.version=latest
lt.platform=Windows 10
lt.resolution=1920x1080
lt.network=true
lt.console=true
lt.visual=true
lt.video=true
lt.timezone=Asia/Kolkata

# Tunnel (set to true for testing local/staging environments)
lt.tunnel=false
lt.tunnel.name=atr-automation-tunnel

# Selenium version
lt.selenium.version=4.0.0
